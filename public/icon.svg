<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid background with rounded squircle for standalone icon -->
  <rect width="512" height="512" rx="112" fill="#27201D" />
  
  <!-- Subtle accent border -->
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="#E28A6D" stroke-width="6" stroke-opacity="0.3" />

  <!-- Calendar Page Base -->
  <rect x="116" y="148" width="280" height="254" rx="28" fill="#FAF8F4" />
  
  <!-- Calendar Top Header Banner -->
  <path d="M116 176c0-15.464 12.536-28 28-28h224c15.464 0 28 12.536 28 28v40H116v-40z" fill="#8C3B2B" />
  
  <!-- Spiral / Binder Rings at top -->
  <rect x="166" y="112" width="24" height="60" rx="12" fill="#E28A6D" />
  <rect x="322" y="112" width="24" height="60" rx="12" fill="#E28A6D" />

  <!-- Calendar Grid / Timeline Entries inside page -->
  <!-- Row 1: Active memory dot & line -->
  <circle cx="164" cy="260" r="14" fill="#8C3B2B" />
  <rect x="198" y="252" width="156" height="16" rx="8" fill="#3D312B" fill-opacity="0.85" />

  <!-- Row 2: Future / upcoming item -->
  <circle cx="164" cy="312" r="14" fill="#E28A6D" />
  <rect x="198" y="304" width="124" height="16" rx="8" fill="#78716C" fill-opacity="0.65" />

  <!-- Row 3: Past archive item -->
  <circle cx="164" cy="362" r="14" fill="#A8A29E" />
  <rect x="198" y="354" width="144" height="16" rx="8" fill="#A8A29E" fill-opacity="0.5" />
</svg>
